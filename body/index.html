<style>
/* Layout: full-bleed 3D stage; title top-left, vital-signs monitor top-right, control dock along the bottom */
:root{
  --bg:#0c0d0f; --fg:#ecebe6; --muted:#9a968e; --line:rgba(236,235,230,.12); --panel:rgba(16,17,19,.78);
  --accent:#e0795b; --art:#e2483f; --vein:#5b7fe0; --nerve:#e6c15a; --ok:#58d39a;
  --f-display:"Cormorant Garamond","Songti SC","Noto Serif SC",serif;
  --f-body:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{pointer-events:auto;max-width:420px}
.brand .k{font:500 11px/1 var(--f-mono);letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.brand h1{font:500 clamp(28px,4.2vw,44px)/1.05 var(--f-display);margin:6px 0 4px;letter-spacing:.01em}
.brand h1 i{font-style:italic;color:var(--muted);font-weight:500}
.brand p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.brand .stats{font:12px/1.4 var(--f-mono);color:var(--muted);margin-top:6px}

.vitals{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);width:240px}
.vitals .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.vitals .big{font:500 26px/1 var(--f-mono);color:var(--ok)}
.vitals .big small{font-size:11px;color:var(--muted);margin-left:3px}
.vitals .lab{font-size:11px;color:var(--muted)}
.vitals canvas{display:block;width:100%;height:54px;margin:6px 0 4px}
.vitals .mini{display:flex;gap:14px;font:12px/1.3 var(--f-mono);color:var(--fg)}
.vitals .mini span{color:var(--muted);font-family:var(--f-body);margin-right:4px}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(980px,calc(100% - 24px));
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp .gl{font-size:11px;color:var(--muted);margin-right:4px;letter-spacing:.06em}
.chip{height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);transition:background .2s,color .2s,border-color .2s}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.chip[aria-pressed="true"]{color:var(--fg);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.chip:hover{color:var(--fg)}
.sep{width:1px;height:22px;background:var(--line)}
.cta{height:36px;padding:0 16px;border-radius:999px;background:var(--accent);color:#1a0f0b;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.cta svg{width:14px;height:14px}

/* guided tour caption */
.cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(720px,calc(100% - 24px));
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none}
.cap.on{display:block}
.cap .h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.cap .t{font:500 20px/1.2 var(--f-display);letter-spacing:.02em}
.cap .n{font:12px var(--f-mono);color:var(--muted)}
.cap p{margin:0;font-size:14px;line-height:1.65;color:#d8d5ce}
.cap .ctl{display:flex;gap:6px;margin-top:8px;align-items:center}
.cap .bar{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.cap .bar i{display:block;height:100%;width:0;background:var(--accent)}
.cap .st{font:11px var(--f-mono);color:var(--muted)}

/* click info */
.info{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 168px);width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none}
.info.on{display:block}
.info .t{font-size:16px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.info .t button{color:var(--muted);font-size:18px;line-height:1}
.info .s{font:11px var(--f-mono);color:var(--accent);letter-spacing:.1em;margin-bottom:6px}
.info p{margin:0;font-size:13px;line-height:1.6;color:#d0cdc6}

.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);transition:opacity .8s}
.load.done{opacity:0;pointer-events:none}
.load .t{font:500 26px var(--f-display);letter-spacing:.04em}
.load .bar{width:220px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.load .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.load .s{font:12px var(--f-mono);color:var(--muted);height:16px}
body.touring .dock{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px)}
.dock{transition:opacity .4s,transform .4s}
body.touring .cap{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
body.touring .brand p,body.touring .brand .stats{display:none}
.lbl{position:fixed;left:0;top:0;font:500 12px/1 var(--f-body);color:var(--fg);letter-spacing:.08em;pointer-events:none;white-space:nowrap;transform:translate(-50%,0);opacity:0;transition:opacity .5s;text-shadow:0 1px 6px #000}
.lbl.on{opacity:.9}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);font-size:12px;color:var(--muted);pointer-events:none;opacity:0;transition:opacity .6s}

@media (max-width:720px){
  .brand h1 i{display:none}.hint{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 168px)}
  body.touring .cap{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  .brand p{display:none}.brand .stats{display:none}
  .vitals{width:150px;padding:8px 10px 6px}.vitals canvas{height:34px}.vitals .big{font-size:20px}.vitals .mini{display:none}
  .dock{gap:6px 8px;padding:8px}.chip{height:30px;padding:0 9px;font-size:12px}.grp .gl{display:none}.sep{display:none}
  .cap{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}.cap p{font-size:13px}
  .info{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);left:12px;right:12px;width:auto}
}

// build one tube per path with variable radius, skin weights and distance-from-source for the flow shader
function buildTubes(paths,rk=1){const out=[],samples={};
  for(const p of paths){const pts=p.pts.map(q=>new V(...q[0])),curve=new THREE.CatmullRomCurve3(pts,false,'centripetal'),len=curve.getLength();
    const fam=p.kind==='nerve'?'n':p.kind==='vein'||p.kind==='part'?'v':'a';const list=samples[fam]||(samples[fam]=[]);
    let d0=0;if(list.length){let best=1e9;for(const s of list){const d=s.p.distanceToSquared(pts[0]);if(d<best){best=d;d0=s.d;}}}
    const seg=Math.max(8,Math.round(len/.006)),rs=p.r0>.005?10:7,g=new THREE.TubeGeometry(curve,seg,1,rs,false);
    const P=g.attributes.position,uv=g.attributes.uv,c=new V(),q=new V(),D=new Float32Array(P.count);
    for(let i=0;i<P.count;i++){const u=uv.getX(i);curve.getPointAt(u,c);q.fromBufferAttribute(P,i).sub(c).multiplyScalar(lerp(p.r0,p.r1,u)*rk).add(c);P.setXYZ(i,q.x,q.y,q.z);D[i]=d0+u*len;}
    for(let k=0;k<=20;k++)list.push({p:curve.getPointAt(k/20),d:d0+k/20*len});
    g.setAttribute('aDist',new THREE.BufferAttribute(D,1));g.computeVertexNormals();pathWeights(g,p.pts);out.push({key:p.key,kind:p.kind,geo:g});}
  return out;}

    if(r.misc){const m=r.misc;GEO.bones.push({key:'ribs',bone:'chest',geo:rawGeo(m.ribs),info:'ribs'},{key:'cart',bone:'chest',cart:true,geo:rawGeo(m.cart),info:'cart'},{key:'sternum',bone:'chest',geo:rawGeo(m.sternum),info:'sternum'});
      GEO.otubes=m.otubes.map(t=>({...t,geo:rawGeo(t.g)}));GEO.diaphragm=rawGeo(m.diaphragm);GEO.htubes=m.htubes.map(t=>({...t,geo:rawGeo(t.g)}));GEO.vessels=m.vessels.map(t=>({...t,geo:rawGeo(t.g)}));GEO.nerves=m.nerves.map(t=>({...t,geo:rawGeo(t.g)}));}}}

// parallel build: workers load three.js from the same CDN and run the same generator source; falls back to the main thread
async function buildGeometryAsync(onProgress){const jobs=jobList(),results=new Array(jobs.length);let done=0;const tick=(i)=>{done++;onProgress&&onProgress(done,jobs.length,jobs[i]);};
  const src=document.getElementById('gen');let pool=[];
  try{const n=Math.max(1,Math.min(4,(navigator.hardwareConcurrency||2)-1));if(!src||!window.Worker||location.protocol==='file:')throw 0;
    const code=`importScripts(${JSON.stringify(THREE_URL)},${JSON.stringify(BGU_URL)});\n${src.textContent}\nonmessage=e=>{let r;try{r=runJob(e.data.id);}catch(err){postMessage({i:e.data.i,err:String(err)});return;}const tr=[];const walk=o=>{if(!o||typeof o!=='object')return;if(ArrayBuffer.isView(o)){if(!tr.includes(o.buffer))tr.push(o.buffer);return;}for(const k in o)walk(o[k]);};walk(r);postMessage({i:e.data.i,r},tr);};`;
    const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));for(let k=0;k<n;k++)pool.push(new Worker(url));}catch(e){pool=[];}
  if(pool.length){let next=0,failed=false;
    // biggest jobs first so the pool stays busy
    const order=jobs.map((j,i)=>i).sort((a,b)=>(jobs[a]==='skin'?-2:jobs[a]==='misc'?-1:0)-(jobs[b]==='skin'?-2:jobs[b]==='misc'?-1:0));
    await new Promise((res)=>{const feed=w=>{if(next>=order.length){w.terminate();return;}const i=order[next++];w.postMessage({id:jobs[i],i});};
      let out=0,alive=pool.length;const timer=setTimeout(()=>{failed=true;res();},25000);
      pool.forEach(w=>{w.onmessage=e=>{if(e.data.err){failed=true;}else results[e.data.i]=e.data.r;tick(e.data.i);out++;if(out>=jobs.length){clearTimeout(timer);res();}else feed(w);};w.onerror=()=>{failed=true;w.terminate();alive--;if(alive<=0){clearTimeout(timer);res();}};feed(w);});});
    pool.forEach(w=>{try{w.terminate();}catch(e){}});if(!failed&&results.every(Boolean)){assemble(results);return 'workers';}}
  // fallback: one job per frame on the main thread
  done=results.filter(Boolean).length;for(let i=0;i<jobs.length;i++){if(results[i])continue;await new Promise(r=>setTimeout(r,0));results[i]=runJob(jobs[i]);tick(i);}
  assemble(results);return 'main';}

function poseAngles(g,ph,breath){const c=x=>Math.cos(TAU*x),s=x=>Math.sin(TAU*x),R={};

  $('cT').textContent=st.t;$('cN').textContent=`${i+1} / ${STEPS.length}`;$('cP').textContent=NARR[st.id];say(NARR[st.id],st.id);soundStatus();}
function tourTick(dt){if(!tour||tour.paused||!ready)return;tour.t+=dt;$('cBar').style.width=Math.min(100,tour.t/tour.dur*100).toFixed(1)+'%';if(tour.t>=tour.dur&&!speaking)tourGo(tour.i+1);}
$('bTour').addEventListener('click',()=>{if(!ready)return;tour?tourStop():tourStart();});
$('cX').addEventListener('click',tourStop);$('cNext').addEventListener('click',()=>tour&&tourGo(tour.i+1));$('cPrev').addEventListener('click',()=>tour&&tourGo(tour.i-1));
$('cPause').addEventListener('click',()=>{if(!tour)return;tour.paused=!tour.paused;$('cPause').textContent=tour.paused?'继续':'暂停';const c=AudioKit.ctx;if(c){try{tour.paused?c.suspend():c.resume();}catch(e){}}if(TTS)try{tour.paused?speechSynthesis.pause():speechSynthesis.resume();}catch(e){}});
addEventListener('keydown',e=>{if(!tour)return;if(e.key==='ArrowRight')tourGo(tour.i+1);if(e.key==='ArrowLeft')tourGo(tour.i-1);if(e.key==='Escape')tourStop();});

</script>
