<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1c1e; --bg2:#0b0c0d; --fg:#ecebe8; --muted:#97928c; --line:rgba(236,235,232,.13);
  --panel:rgba(18,19,21,.82); --accent:#f0655c; --on-fg:#121315; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1b1c1e; --bg2:#0b0c0d; --fg:#ecebe8; --muted:#97928c; --line:rgba(236,235,232,.13);
  --panel:rgba(18,19,21,.82); --accent:#f0655c; --on-fg:#121315; color-scheme:dark }
html,body{height:100%}

.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.g-top b{font-family:var(--f-display);font-size:15px}

.btn.tiny[aria-pressed="false"]{opacity:.5;text-decoration:line-through}#btnTraffic.tiny[aria-pressed="false"]{text-decoration:none}

[hidden]{display:none!important}

<div id="stage"></div>
<div id="loader"><div class="spin"></div><p>正在铺设机坪…</p></div>

<div class="top">
  <div class="label">

    <h1>机坪<em>俯瞰</em></h1>
    <p class="lede">照着一张机坪航拍，用代码重建的整片停机位：三架窄体客机、四座登机桥、几十台地勤车辆，地面标线和影子都对着原图摆放。</p>
    <div class="stats" id="stats"></div>
  </div>
</div>
<div id="toast"></div>
<aside class="gantt" id="gantt" aria-label="中间机位过站流程">

  <div class="g-sub"><span id="gPax">舱内旅客</span><button class="btn tiny" id="btnTraffic" aria-pressed="true">路面车流</button></div>

      <span class="t-tip" id="tState" role="button" tabindex="0">讲解中也可以拖动画面</span>

      <button data-view="aerial" aria-pressed="true">航拍视角</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
requestAnimationFrame(()=>setTimeout(function(){
if(!window.THREE||!THREE.OrbitControls){document.body.insertAdjacentHTML('beforeend','<div id="err">3D 引擎没有加载成功，请刷新页面重试。</div>');return;}
const V=THREE.Vector3,PI=Math.PI,TAU=PI*2,clamp=THREE.MathUtils.clamp,lerp=THREE.MathUtils.lerp,D2R=PI/180;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LOW=Math.min(screen.width,screen.height)<600||(navigator.hardwareConcurrency||8)<=4;
const $=id=>document.getElementById(id);
// photo pixel → world: 1 unit = 10 px of the 1400×800 source photo; x east, z south, y up
const W=(px,py,y=0)=>new V((px-700)/10,y,(py-400)/10);
let sd=1;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;

/* ================= renderer, camera, light ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,LOW?1.75:2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor(0,0);
$('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(12,1,1,5000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.screenSpacePanning=true;
controls.maxPolarAngle=PI*.495;controls.minDistance=8;controls.maxDistance=2600;
const hemi=new THREE.HemisphereLight(0xdfe7f2,0x6f6a60,.42);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3e2,1.55);sun.position.set(48,72,-14);sun.target.position.set(0,0,0);
sun.castShadow=true;sun.shadow.mapSize.set(LOW?2048:4096,LOW?2048:4096);
Object.assign(sun.shadow.camera,{left:-95,right:95,top:95,bottom:-95,near:1,far:260});sun.shadow.bias=-.0009;sun.shadow.normalBias=.09;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xcfe0ff,.25);fill.position.set(40,50,60);scene.add(fill);
const sky=new THREE.Mesh(new THREE.SphereGeometry(2400,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(0x8fb3d9)},hor:{value:new THREE.Color(0xe6e4de)}},
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 hor;varying vec3 vP;void main(){float h=clamp(vP.y,0.,1.);gl_FragColor=vec4(mix(hor,top,pow(h,.55)),1.);}'}));
scene.add(sky);scene.fog=new THREE.Fog(0xe6e4de,600,3000);

/* ================= layers, materials ================= */
const LAYERS=[{n:'地面',sw:'--sw0',lift:0},{n:'地面标线',sw:'--sw1',lift:7},{n:'地勤车辆',sw:'--sw2',lift:15},{n:'客机',sw:'--sw3',lift:25},{n:'登机桥',sw:'--sw4',lift:36},{n:'航站楼',sw:'--sw5',lift:46}];
const LG=LAYERS.map(()=>{const g=new THREE.Group();scene.add(g);return g;});
const layerMats=LAYERS.map(()=>[]),mcache={};
function M(l,key,opts){const id=l+key;if(mcache[id])return mcache[id];const o=Object.assign({side:THREE.DoubleSide},opts);const phys=o.physical;delete o.physical;
  const m=phys?new THREE.MeshPhysicalMaterial(o):new THREE.MeshStandardMaterial(o);m.userData.baseTr=!!o.transparent;m.userData.baseOp=o.opacity??1;layerMats[l].push(m);return mcache[id]=m;}
function mesh(geo,l,key,opts,name,parent){const m=new THREE.Mesh(geo,M(l,key,opts));m.castShadow=m.receiveShadow=true;m.userData={layer:l,name};(parent||LG[l]).add(m);return m;}
const cvs=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;};
function tex(c,srgb=true){const t=new THREE.CanvasTexture(c);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}


/* ---- soft contact shadows (ambient occlusion decals) and sky ---- */
const aoTex=(()=>{const c=cvs(128),x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.45,'rgba(0,0,0,.75)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(c);return t;})();
const aoEdge=(()=>{const c=cvs(4,64),x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,64);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,4,64);return new THREE.CanvasTexture(c);})();
const aoMat=[],aoGeo=new THREE.PlaneGeometry(1,1).rotateX(-PI/2);
function aoM(l,op){const k=l+':'+op;if(aoMat[k])return aoMat[k];const m=new THREE.MeshBasicMaterial({map:aoTex,color:0x000000,transparent:true,opacity:op,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2});m.userData={baseOp:op,baseTr:true};layerMats[l].push(m);return aoMat[k]=m;}
function ao(parent,w,d,l,op=.42,x=0,z=0){const m=new THREE.Mesh(aoGeo,aoM(l,op));m.scale.set(w,1,d);m.position.set(x,.035,z);m.renderOrder=1;m.userData={layer:l};parent.add(m);return m;}
function aoBand(cx,cz,w,d,l){const m=new THREE.MeshBasicMaterial({map:aoEdge,color:0,transparent:true,opacity:.32,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2});m.userData={baseOp:.32,baseTr:true};layerMats[l].push(m);
  const B=2.6;[[w,B,0,d/2+B/2,0],[w,B,0,-d/2-B/2,PI],[d,B,w/2+B/2,0,-PI/2],[d,B,-w/2-B/2,0,PI/2]].forEach(([a,b,x,z,r])=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(a,b).rotateX(-PI/2),m);p.position.set(cx+x,.04,cz+z);p.rotation.y=r;p.userData={layer:l};LG[l].add(p);});}

/* ================= ground: concrete slabs, asphalt, stains (layer 0) ================= */
const GK=2.926;  // canvas px per photo px (4096 / 1400)
function groundCanvas(){const c=cvs(4096,2340),x=c.getContext('2d');x.scale(GK,GK);sd=11;
  x.fillStyle='#a9a59d';x.fillRect(0,0,1400,800);
  // concrete slabs with per-slab tone
  const SW=55,SH=52;
  for(let gy=-1;gy*SH<800;gy++)for(let gx=0;gx*SW<1400;gx++){const v=166+(rnd()-.5)*14|0,w=(rnd()-.5)*4;x.fillStyle=`rgb(${v+w},${v-1+w},${v-6})`;x.fillRect(gx*SW,gy*SH+12,SW,SH);}
  x.strokeStyle='rgba(70,66,60,.32)';x.lineWidth=.9;
  for(let gx=0;gx<=1400;gx+=SW){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,800);x.stroke();}
  for(let gy=12;gy<=800;gy+=SH){x.beginPath();x.moveTo(0,gy);x.lineTo(1400,gy);x.stroke();}
  // top service road (asphalt) and the lighter forecourt

let tour=null,tour_sfx=false;const tourCard=$('tourCard'),drawerEl=document.querySelector('#drawer');
function shotDur(st){const a=clipLen[st.id],b=TTS&&voiceOn&&!VO.has(st.id)?NARR[st.id].length*.24+1:0;return Math.max(st.d,(a||0)+1.2,b);}
function setTod(v){tod=v;document.querySelectorAll('[data-tod]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.tod===v)));}
function shotEnter(i){const st=SHOTS[i];tour.i=i;tour.t=0;tour.user=false;tour.D=shotDur(st);tour.from=[camera.position.clone(),controls.target.clone(),camera.fov];tour.fov=st.fov||38;
  if(explodeT>0){explodeT=0;syncEx();}setFocus(null);setTod(st.tod||'day');TA.t=st.ta[0];TA.play=true;TA.speed=(st.ta[1]-st.ta[0])/(tour.D*.8);
  camTween=null;curView='tour';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed','false'));
  $('tStep').textContent=`${i+1} / ${SHOTS.length}`;$('tTitle').textContent=st.title;$('tText').textContent=NARR[st.id];say(NARR[st.id],st.id);}
function tourStart(){getAudio();preloadVoice();if(Music.on)Music.start();tour_sfx=Sfx.on;if(!Sfx.on)setSfx(true);tour={i:0,t:0,paused:false};drawerEl.hidden=true;tourCard.hidden=false;$('tPause').textContent='暂停';shotEnter(0);resize();}
function tourStop(){if(!tour)return;tour=null;hush();Music.stop();if(!tour_sfx)setSfx(false);tourCard.hidden=true;drawerEl.hidden=false;TA.speed=1;TA.play=true;setTod('day');camera.fov=36;camera.updateProjectionMatrix();
  document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.speed==='1')));syncPlay();resize();goView('free');}
function tourPause(v){tour.paused=v;TA.play=!v;$('tPause').textContent=v?'继续':'暂停';pauseAll(v);}
$('btnTour').addEventListener('click',tourStart);$('tExit').addEventListener('click',tourStop);
$('tPause').addEventListener('click',()=>tourPause(!tour.paused));
$('tNext').addEventListener('click',()=>{if(!tour)return;hush();tourPause(false);tour.i+1<SHOTS.length?shotEnter(tour.i+1):tourStop();});
$('tPrev').addEventListener('click',()=>{if(!tour)return;hush();tourPause(false);shotEnter(Math.max(0,tour.i-1));});
const bVo=$('tVoice'),bMu=$('tMusic');if(!TTS&&!VO.size){voiceOn=false;bVo.hidden=true;}
bVo.addEventListener('click',()=>{voiceOn=!voiceOn;bVo.setAttribute('aria-pressed',String(voiceOn));voiceOn&&tour?say(NARR[SHOTS[tour.i].id],SHOTS[tour.i].id):hush();});
bMu.addEventListener('click',()=>{Music.on=!Music.on;bMu.setAttribute('aria-pressed',String(Music.on));Music.on&&tour?Music.start():Music.stop();});
controls.addEventListener('start',()=>{if(tour)tour.user=true;});
function tourTick(dt){if(!tour)return;if(!tour.paused)tour.t+=dt;const st=SHOTS[tour.i],u=clamp(tour.t/tour.D,0,1);
  if(!tour.user){const [p,tg]=st.cam(ease(u)),k=ease(clamp(tour.t/2.2,0,1));camera.position.lerpVectors(tour.from[0],p,k);
    camera.position.y+=Math.sin(k*PI)*Math.max(8,tour.from[0].distanceTo(p)*.3);controls.target.lerpVectors(tour.from[1],tg,k);camera.fov=lerp(tour.from[2],tour.fov,k);camera.updateProjectionMatrix();}
  if(TA.t>st.ta[1])TA.play=false;
  $('tBar').style.width=((tour.i+u)/SHOTS.length*100).toFixed(1)+'%';
  if(tour.t>=tour.D&&(!speaking||tour.t>tour.D+6)){tour.i+1<SHOTS.length?shotEnter(tour.i+1):tourStop();}}

/* ================= apron sound effects: distant airport rumble, the middle jet's engines, the pushback tug's reverse beeper ================= */
const _sp=new V();
const Sfx={on:false,n:null,
  start(){const c=AudioKit.ensure();if(!c||this.n)return;const out=c.createGain();out.gain.value=0;out.connect(AudioKit.master);out.gain.setTargetAtTime(1,c.currentTime,.6);
    const noiseBuf=(sec,brown)=>{const b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate),d=b.getChannelData(0);let v=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(brown){v=(v+.02*w)/1.02;d[i]=v*3.5;}else d[i]=w;}return b;};
    const loop=(buf)=>{const s=c.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s;};
    const chain=(src,...nodes)=>{nodes.reduce((a,b)=>{a.connect(b);return b;},src).connect(out);};
    const filt=(type,f,q)=>{const x=c.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x;};
    const gain=v=>{const g=c.createGain();g.gain.value=v;return g;};
    const bed=loop(noiseBuf(4,true)),bedG=gain(.1);chain(bed,filt('lowpass',360),bedG);
    const air=loop(noiseBuf(2,false)),airF=filt('bandpass',900,.7),airG=gain(0);chain(air,airF,airG);
    const whine=c.createOscillator();whine.type='sine';whine.frequency.value=1200;whine.start();const whG=gain(0);chain(whine,whG);
    const rum=c.createOscillator();rum.type='sawtooth';rum.frequency.value=45;rum.start();const rumG=gain(0);chain(rum,filt('lowpass',180),rumG);
    const beep=c.createOscillator();beep.type='square';beep.frequency.value=1050;beep.start();const bpG=gain(0);chain(beep,filt('lowpass',2400),bpG);
    this.n={out,srcs:[bed,air,whine,rum,beep],airF,airG,whine,whG,rum,rumG,bpG};},
  stop(){const n=this.n;if(!n)return;this.n=null;const c=AudioKit.ctx;n.out.gain.setTargetAtTime(0,c.currentTime,.25);setTimeout(()=>{n.srcs.forEach(s=>{try{s.stop();}catch(e){}});n.out.disconnect();},1600);},
  update(){const n=this.n;if(!n)return;const c=AudioKit.ctx,t=c.currentTime;P2.g.getWorldPosition(_sp);
    const att=P2.g.visible?clamp(28/(camera.position.distanceTo(_sp)+8),0,1):0,rpm=P2.rpm||0;
    n.airG.gain.setTargetAtTime(rpm*att*.45,t,.2);n.airF.frequency.setTargetAtTime(500+1100*rpm,t,.4);
    n.whine.frequency.setTargetAtTime(700+2600*rpm,t,.5);n.whG.gain.setTargetAtTime(rpm*att*.03,t,.2);
    n.rum.frequency.setTargetAtTime(35+55*rpm,t,.5);n.rumG.gain.setTargetAtTime(rpm*att*.16,t,.2);
    const pushing=TA.t>37.5&&TA.t<41&&TA.play&&pushTug.visible,on=pushing&&(performance.now()/900%1)<.33;
    n.bpG.gain.setTargetAtTime(on?.05*clamp(22/(camera.position.distanceTo(pushTug.position)+6),0,1):0,t,.008);}};
const bSfx=$('btnSfx');function setSfx(v){Sfx.on=v;bSfx.setAttribute('aria-pressed',String(v));v?Sfx.start():Sfx.stop();}
bSfx.addEventListener('click',()=>{getAudio();setSfx(!Sfx.on);});
setInterval(()=>{const el=$('tState');if(el&&!tourCard.hidden)soundStatus(el,'讲解中也可以拖动画面');},500);
$('tState').addEventListener('click',()=>{getAudio();if(tour&&tour.paused)tourPause(false);});
/* ================= loop ================= */
const clock=new THREE.Clock();const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(camTween){camTween.t=Math.min(1,camTween.t+dt/camTween.dur);const k=ease(camTween.t);camera.position.lerpVectors(camTween.from,camTween.to,k);controls.target.lerpVectors(camTween.ft,camTween.tt,k);camera.fov=lerp(camTween.f0,camTween.f1,k);camera.updateProjectionMatrix();if(camTween.t>=1)camTween=null;}
  // explode: lift each layer with a stagger
  explode+=(explodeT-explode)*Math.min(1,dt*2.2);
  LG.forEach((g,l)=>{const s=clamp((explode*1.6-l*.12),0,1);g.position.y=LAYERS[l].lift*ease(s);});
  // focus fade
  for(let l=0;l<LAYERS.length;l++){const tg=(focus===null||focus===l)?1:.07;layerOp[l]+=(tg-layerOp[l])*Math.min(1,dt*8);
    for(const m of layerMats[l]){const op=(m.userData.baseOp??1)*layerOp[l],tr=m.userData.baseTr||layerOp[l]<.995;if(m.transparent!==tr){m.transparent=tr;m.needsUpdate=true;}m.opacity=op;m.depthWrite=layerOp[l]>.5;}}
  // beacons, traffic, pushback
  planes.forEach((p,i)=>{const live=i===1&&(TA.t<4.2||TA.t>36.8);   // parked jets on the bridge keep the beacon off
  const on=live&&((t+i*.37)%1.1)<.12;p.beacon.material.color.setHex(on?0xff3030:0x5a0d0d);p.beacon.scale.setScalar(on?1.6:1);});
  trainStep(traffic&&!reduceMotion?dt:0);
  tourTick(dt);const tt=taUpdate(dt);Sfx.update();rollUpdate();paxUpdate(tt);ganttUpdate(tt);tl.material.color.setRGB(.17*todK.win*1.6+.02,1*todK.win*1.6+.04,.48*todK.win*1.6+.03);tl.visible=todK.win>.05;
  planes.forEach(p=>{if(p.fans){p.ang=(p.ang||0)+dt*30*(p.rpm||0);p.fans.forEach(f=>f.rotation.z=p.ang);}});
  applyTod(dt);
  controls.update();{const cd=camera.position.distanceTo(controls.target),nr=clamp(cd*.012,.05,4),fr=cd*14+900;if(Math.abs(camera.near-nr)>nr*.05||Math.abs(camera.far-fr)>fr*.05){camera.near=nr;camera.far=fr;camera.updateProjectionMatrix();}sky.scale.setScalar(camera.far*.85/2400);sky.position.copy(camera.position);}
  renderer.render(scene,camera);
  const ld=$('loader');if(ld&&!ld.classList.contains('done')){ld.classList.add('done');setTimeout(()=>ld.remove(),700);}
  requestAnimationFrame(loop);}
loop();
},0));
