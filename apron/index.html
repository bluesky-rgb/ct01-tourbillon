{const g=new THREE.PlaneGeometry(140,80);g.rotateX(-PI/2);mesh(g,0,'ground',{map:gTex,roughness:.92,metalness:0},'机坪 · 混凝土道面');

let fitH=40,camTween=null,explode=0,explodeT=0;
const VIEWS={aerial:{pos:()=>new V(0,380,70).normalize().multiplyScalar(aerialDist()).add(new V(0,0,2.5)),tg:new V(0,0,2.5),fov:()=>12},free:{pos:()=>new V(62,58,96),tg:new V(4,0,4),fov:()=>36},low:{pos:()=>new V(-30,4.5,36),tg:new V(-8,4,0),fov:()=>48},stand:{pos:()=>new V(30,26,44),tg:new V(-1,1,6),fov:()=>34},
  explode:{pos:()=>new V(95,95,120),tg:new V(0,18,0),fov:()=>36}};
let padT=0,padB=0;
function aerialDist(){const h=innerHeight,u=Math.max(1,h-padT-padB),a=innerWidth/u;return Math.max(39.6,70/a)*h/u/Math.tan(6*D2R);}
function goView(v,dur){const o=VIEWS[v];camTween={from:camera.position.clone(),to:o.pos(),ft:controls.target.clone(),tt:o.tg.clone(),f0:camera.fov,f1:o.fov(),t:0,dur:dur||1.6};
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)));curView=v;}
let curView='aerial';
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{if(explodeT>0){explodeT=0;syncEx();}goView(b.dataset.view);}));
controls.addEventListener('start',()=>{camTween=null;});
const bE=$('btnExplode');function syncEx(){bE.setAttribute('aria-pressed',String(explodeT>0));bE.textContent=explodeT>0?'合上':'拆层';}
bE.addEventListener('click',()=>{explodeT=explodeT>0?0:1;syncEx();goView(explodeT?'explode':'free');if(explodeT)document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed','false'));});

/* time of day */
const TOD={day:{sun:[0xfff3e2,1.55],pos:[48,72,-14],hemi:[0xdfe7f2,0x6f6a60,.42],fill:.18,flood:0,win:0,exp:.82},
  dusk:{sun:[0xffa45c,1.2],pos:[90,22,-6],hemi:[0x8a7fa8,0x4a4038,.32],fill:.12,flood:.35,win:.35,exp:1.05},
  night:{sun:[0x9fb3ff,.12],pos:[30,80,-40],hemi:[0x223048,0x111111,.12],fill:.03,flood:1,win:1,exp:1.15}};
let tod='day',todK={...TOD.day};const flood=[];
masts.forEach(({p})=>{const s=new THREE.SpotLight(0xffe2b0,0,140,.9,.6,1.2);s.position.set(p.x,30,p.z);s.target.position.set(p.x+ (p.x<0?-8:6),0,p.z+22);scene.add(s,s.target);flood.push(s);});
document.querySelectorAll('[data-tod]').forEach(b=>b.addEventListener('click',()=>{tod=b.dataset.tod;document.querySelectorAll('[data-tod]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));
const winCol=new THREE.Color(0xffd79a);
function applyTod(dt){const T=TOD[tod],k=Math.min(1,dt*2.2);
  sun.color.lerp(new THREE.Color(T.sun[0]),k);sun.intensity=lerp(sun.intensity,T.sun[1],k);sun.position.lerp(new V(...T.pos),k);
  hemi.color.lerp(new THREE.Color(T.hemi[0]),k);hemi.groundColor.lerp(new THREE.Color(T.hemi[1]),k);hemi.intensity=lerp(hemi.intensity,T.hemi[2],k);
  fill.intensity=lerp(fill.intensity,T.fill,k);renderer.toneMappingExposure=lerp(renderer.toneMappingExposure,T.exp,k);
  flood.forEach(s=>s.intensity=lerp(s.intensity,T.flood*5,k));todK.win=lerp(todK.win,T.win,k);
  winMats.forEach(m=>{m.emissive.copy(winCol).multiplyScalar(todK.win*.55);});masts.forEach(({head})=>head.material.emissive.copy(winCol).multiplyScalar(todK.win*2.5));}

/* tap to identify */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),cv=renderer.domElement;let down=null;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
cv.addEventListener('pointerup',e=>{if(!down)return;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<7&&performance.now()-down.t<450){const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
    const vis=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};
    const hit=ray.intersectObjects(LG,true).find(h=>vis(h.object)&&h.object.userData.name&&layerOp[h.object.userData.layer]>.5);
    if(hit){const l=hit.object.userData.layer;showToast(hit.object.userData.name,LAYERS[l].n);}}down=null;});
let traffic=true;const bT=$('btnTraffic');bT.addEventListener('click',()=>{traffic=!traffic;bT.setAttribute('aria-pressed',String(traffic));});

/* resize */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  const lab=document.querySelector('.label').getBoundingClientRect(),dr=document.querySelector('.drawer').getBoundingClientRect();padT=lab.height?lab.bottom+8:0;padB=dr.height?h-dr.top+8:0;
  if(w>=1100){padT=0;padB=0;}else if(w>=900){padT=Math.min(padT,h*.22);padB=Math.min(padB,h*.4);}
  if(curView==='aerial'&&!camTween){const tg=VIEWS.aerial.tg;camera.position.sub(controls.target).setLength(aerialDist()).add(controls.target);}
  camera.setViewOffset(w,h,0,(padB-padT)/2,w,h);camera.updateProjectionMatrix();}
addEventListener('resize',resize);
controls.target.copy(VIEWS.aerial.tg);camera.position.set(0,380,70);camera.aspect=innerWidth/innerHeight;resize();camera.position.copy(VIEWS.aerial.pos());

/* ================= loop ================= */
const clock=new THREE.Clock();const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(camTween){camTween.t=Math.min(1,camTween.t+dt/camTween.dur);const k=ease(camTween.t);camera.position.lerpVectors(camTween.from,camTween.to,k);controls.target.lerpVectors(camTween.ft,camTween.tt,k);camera.fov=lerp(camTween.f0,camTween.f1,k);camera.updateProjectionMatrix();if(camTween.t>=1)camTween=null;}
  // explode: lift each layer with a stagger
  explode+=(explodeT-explode)*Math.min(1,dt*2.2);
  LG.forEach((g,l)=>{const s=clamp((explode*1.6-l*.12),0,1);g.position.y=LAYERS[l].lift*ease(s);});
  // focus fade
  for(let l=0;l<LAYERS.length;l++){const tg=(focus===null||focus===l)?1:.07;layerOp[l]+=(tg-layerOp[l])*Math.min(1,dt*8);
    for(const m of layerMats[l]){const op=(m.userData.baseOp??1)*layerOp[l],tr=m.userData.baseTr||layerOp[l]<.995;if(m.transparent!==tr){m.transparent=tr;m.needsUpdate=true;}m.opacity=op;m.depthWrite=layerOp[l]>.5;}}
  // beacons, traffic, pushback
  planes.forEach((p,i)=>{const live=i!==1||TA.t<4.2||TA.t>36.8;const on=live&&((t+i*.37)%1.1)<.12;p.beacon.material.color.setHex(on?0xff3030:0x5a0d0d);p.beacon.scale.setScalar(on?1.6:1);});
  if(traffic&&!reduceMotion){train.position.x+=dt*5.5;if(train.position.x>82)train.position.x=-82;bus.position.x-=dt*7;if(bus.position.x<-90)bus.position.x=90;}
  const tt=taUpdate(dt);ganttUpdate(tt);tl.material.color.setRGB(.17*todK.win*1.6+.02,1*todK.win*1.6+.04,.48*todK.win*1.6+.03);tl.visible=todK.win>.05;
  planes.forEach(p=>{if(p.fans){p.ang=(p.ang||0)+dt*30*(p.rpm||0);p.fans.forEach(f=>f.rotation.z=p.ang);}});
  applyTod(dt);
  controls.update();renderer.render(scene,camera);
  const ld=$('loader');if(ld&&!ld.classList.contains('done')){ld.classList.add('done');setTimeout(()=>ld.remove(),700);}
  requestAnimationFrame(loop);}
loop();
},0));
</script>
