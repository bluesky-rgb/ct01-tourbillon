<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
requestAnimationFrame(()=>setTimeout(function(){
if(!window.THREE||!THREE.OrbitControls){document.body.insertAdjacentHTML('beforeend','<div id="err">3D 引擎没有加载成功，请刷新页面重试。</div>');return;}
const V=THREE.Vector3,PI=Math.PI,TAU=PI*2,clamp=THREE.MathUtils.clamp,lerp=THREE.MathUtils.lerp;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let demo=null,setting=false;

/* ================= renderer ================= */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
const LOW=Math.min(screen.width,screen.height)<600||(navigator.hardwareConcurrency||8)<=4;
renderer.setPixelRatio(Math.min(devicePixelRatio,LOW?1.75:2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.92;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0,0);
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,.05,120);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.enablePan=false;
controls.minDistance=3;controls.maxDistance=30;

const pmrem=new THREE.PMREMGenerator(renderer);
const env=new THREE.Scene();
env.add(new THREE.Mesh(new THREE.BoxGeometry(20,20,20),new THREE.MeshBasicMaterial({color:0x1d1f22,side:THREE.BackSide})));
function softbox(w,h,c,p){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));m.position.copy(p);m.lookAt(0,0,0);env.add(m);}
softbox(9,3.5,new THREE.Color(3.2,3.05,2.85),new V(0,8,3));softbox(5,5,new THREE.Color(2.4,2.1,1.8),new V(6,4,6));
softbox(2.5,7,new THREE.Color(5,3.8,2.6),new V(-8,0,4));
softbox(2.5,7,new THREE.Color(2.4,3.2,4.6),new V(8,1,-4));
softbox(7,2,new THREE.Color(2,2,2),new V(0,-7,5));
softbox(3,3,new THREE.Color(3,3,3),new V(0,2,-8));
scene.environment=pmrem.fromScene(env,.035).texture;
scene.add(new THREE.HemisphereLight(0xffffff,0x30343a,.25));
const key=new THREE.DirectionalLight(0xfff1df,1.05);key.position.set(3,5,7);key.castShadow=true;
key.shadow.mapSize.set(LOW?1024:2048,LOW?1024:2048);Object.assign(key.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:40});
key.shadow.bias=-.0003;key.shadow.normalBias=.012;scene.add(key);
const back=new THREE.DirectionalLight(0xdfe8ff,.8);back.position.set(-3,3,-7);scene.add(back);

/* ================= procedural textures ================= */
const cvs=s=>{const c=document.createElement('canvas');c.width=c.height=s;return c;};
function tex(c,rep,srgb=true){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep,rep);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
function perlage(){const S=512,c=cvs(S),x=c.getContext('2d');x.fillStyle='#b0b0b0';x.fillRect(0,0,S,S);const st=32;
  for(let r=0;r*st*.85<S+st;r++)for(let k=-1;k*st<S+st;k++){const cx=k*st+(r%2?st/2:0),cy=r*st*.85,R=st*.78;
    const g=x.createRadialGradient(cx-5,cy-5,1,cx,cy,R);g.addColorStop(0,'#e4e4e4');g.addColorStop(.5,'#c0c0c0');g.addColorStop(.85,'#a4a4a4');g.addColorStop(1,'#b2b2b2');
    x.fillStyle=g;x.beginPath();x.arc(cx,cy,R,0,TAU);x.fill();}return c;}
function geneva(){const S=512,c=cvs(S),x=c.getContext('2d'),b=64;
  for(let i=0;i<S/b;i++){const g=x.createLinearGradient(i*b,0,(i+1)*b,0);g.addColorStop(0,'#8c8c8c');g.addColorStop(.45,'#ececec');g.addColorStop(.55,'#d8d8d8');g.addColorStop(1,'#8c8c8c');x.fillStyle=g;x.fillRect(i*b,0,b,S);}return c;}
function sunburst(){const S=512,c=cvs(S),x=c.getContext('2d');x.fillStyle='#bdbdbd';x.fillRect(0,0,S,S);
  for(let i=0;i<720;i++){const a=i/720*TAU;x.strokeStyle=`rgba(${i%2?255:40},${i%2?255:40},${i%2?255:40},${.06+.05*Math.random()})`;
    x.beginPath();x.moveTo(S/2,S/2);x.lineTo(S/2+Math.cos(a)*S,S/2+Math.sin(a)*S);x.stroke();}return c;}
const tPerl=tex(perlage(),2.2),tGen=tex(geneva(),.9),tSun=tex(sunburst(),0);
tGen.center.set(.5,.5);tGen.rotation=.55;
tSun.repeat.set(1.25,1.25);tSun.offset.set(.5,.5);

/* dial textures: RingGeometry UVs map (x/outer+1)/2, so canvas px = C + r/outer*C */
function dialCanvas(){const S=2048,c=cvs(S),x=c.getContext('2d'),C=S/2,O=2.0,u=r=>r/O*C;

function setDemoText(t,speak,id){$('demoText').textContent=t;if(speak!==false)say(t,id);}
const bV=$('btnVoice'),bM=$('btnMusic');if(!TTS&&!VO.size){voiceOn=false;bV.hidden=true;}
bV.addEventListener('click',()=>{voiceOn=!voiceOn;bV.setAttribute('aria-pressed',String(voiceOn));if(!voiceOn)hush();else if(demo)say($('demoText').textContent,String(demo.i+1).padStart(2,'0'));});
bM.addEventListener('click',()=>{Music.on=!Music.on;bM.setAttribute('aria-pressed',String(Music.on));if(Music.on&&demo)Music.start();else Music.stop();});
function demoEnter(i){const st=DEMO[i];
  // every step starts from a clean baseline, so skipping forward or back never leaves stale state
  if(demo.cur&&demo.cur.leave)demo.cur.leave();demo.cur=st;
  setFocus(null);setLabels(false);controls.autoRotate=false;setAuto(false);setSpeed(1);
  if(!st.ex&&explodeTarget>0){explodeTarget=0;syncExplode();}
  if(demo.jumped&&!st.jump){mt=nowSec();demo.jumped=false;}if(st.jump)demo.jumped=true;
  demo.i=i;demo.t=0;st.go();$('demoStep').textContent=`${i+1} / ${DEMO.length}`;$('demoTitle').textContent=st.title;setDemoText(st.text,true,String(i+1).padStart(2,'0'));}
function startDemo(){if(setting)endSet();if(Music.on)Music.start();camTween=null;$('more').open=false;$('custom').open=false;demo={i:0,t:0,paused:false};bP.textContent='暂停';bP.setAttribute('aria-pressed','false');drawer.hidden=true;demoCard.hidden=false;hideToast();demoEnter(0);resize();}
function stopDemo(done){if(!demo)return;if(demo.cur&&demo.cur.leave)demo.cur.leave();demo=null;hush();Music.stop();demoCard.hidden=true;drawer.hidden=false;controls.autoRotate=false;resize();
  if(!done){setFocus(null);}syncExplode();}
$('btnDemo').addEventListener('click',startDemo);
$('btnStop').addEventListener('click',()=>stopDemo(false));
// during the tour the viewer can still orbit and zoom; the tour only takes the camera back at the next step

  if(clip)try{v?clip.pause():clip.play();}catch(e){}

function demoTick(dt){if(!demo||demo.paused)return;demo.t+=dt;const st=DEMO[demo.i];if(st.tick)st.tick(demo.t);
  const tot=DEMO.reduce((a,b)=>a+b.d,0),done=DEMO.slice(0,demo.i).reduce((a,b)=>a+b.d,0)+Math.min(demo.t,st.d);

/* ================= crown time-setting ================= */
let pull=0,crownTurn=0,setVel=0,lastMin=-1;const crownPart=parts.find(p=>p.o===crown);
const setCard=$('setCard');
function startSet(){if(demo)stopDemo(false);if(explodeTarget>.5){explodeTarget=0;syncExplode();}setting=true;controls.enabled=false;controls.autoRotate=false;
  drawer.hidden=true;setCard.hidden=false;hideToast();setLabels(false);markView('');goView('crown',1.2);resize();}
function endSet(){setting=false;controls.enabled=true;setCard.hidden=true;drawer.hidden=false;goView('front',1.2);markView('front');resize();}
$('btnSet').addEventListener('click',startSet);$('btnSetDone').addEventListener('click',endSet);
let drag=null;
cv.addEventListener('pointerdown',e=>{if(!setting)return;drag={x:e.clientX,t:performance.now()};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!setting||!drag)return;const dx=e.clientX-drag.x;drag.x=e.clientX;turnCrown(dx*(innerWidth<600?60:40));});
cv.addEventListener('pointerup',()=>{drag=null;});cv.addEventListener('pointercancel',()=>{drag=null;});
cv.addEventListener('wheel',e=>{if(!setting)return;e.preventDefault();turnCrown(-e.deltaY*30);},{passive:false});

function turnCrown(sec){mt+=sec;crownTurn+=sec/240;}  // one crown turn ≈ 24 minutes of hand travel

/* ================= loop ================= */
const clock=new THREE.Clock();let statT=0;
syncExplode();$('oSpeed').textContent=fmtSpeed(speed);
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  // winding: crown turns the crown wheel, which turns the ratchet and the barrel arbor
  if(windLeft>0){const w=Math.min(windLeft,dt*14);windLeft-=w;power=Math.min(72,power+w);windTotal+=w;}
  // going: escapement releases 6 beats a second while there is power
  if(power>0&&!setting){const adv=dt*speed;mt+=adv;power=Math.max(0,power-adv/3600);}
  pull+=((setting?1:0)-pull)*Math.min(1,dt*7);
  // rotor: a pendulum under gravity; on the wrist the gravity direction keeps changing
  const grav=-PI/2+(autoWind?1.2*Math.sin(t*.9)+.6*Math.sin(t*2.3+1):0);
  rOm+=(-9*Math.sin(rTh-grav)-.8*rOm)*dt;rTh+=rOm*dt;rotor.rotation.z=rTh+PI/2;
  if(autoWind&&power<72){const add=Math.min(72-power,dt*speed/3600+Math.abs(rOm)*dt*.02);power+=add;windTotal+=add;}
  const S=6*mt,base=Math.floor(S),f=S-base,step=speed>40?f:ease(Math.min(1,f/.2));
  const ang=P=>TAU*((base%P)+step)/P;
  if(soundOn&&base!==lastBeat){if(power>0&&speed<=3&&lastBeat>=0)tick(base%2);lastBeat=base;}  // angle of a wheel that turns once every P beats
  const cageA=ang(360);              // 360 beats per cage turn = one turn a minute
  carriage.rotation.z=-cageA;cagePin.rotation.z=-cageA;
  tumble.rotation.x=ang(60);       // inner cage: 6 tumbles per minute
  esc.rotation.z=-ang(30);           // escape pinion rolling on the fixed 84 wheel: 84/7 = 12 turns per minute
  third.rotation.z=ang(2700);        // 75/10: one turn per 7.5 min
  const minA=ang(21600);centre.rotation.z=-minA;cannon.rotation.z=-minA;minHand.rotation.z=-minA;
  barrel.rotation.z=ang(172800);     // 96/12 × 1 h
  minuteWheel.rotation.z=ang(64800);
  const hrA=ang(259200);hourWheel.rotation.z=-hrA;hourHand.rotation.z=-hrA;
  // calendar: everything below is read from the date the train has reached
  const sod=((mt%86400)+86400)%86400,JW=clamp(.4*speed,3,3600),cur=cal(mt);let jp=1,prv=cur;
  if(sod<JW){jp=ease(sod/JW);prv=cal(mt-sod-1);}
  w24.rotation.z=PHI_D+TAU*sod/86400;
  const span=(a,b,n)=>{let to=b;if(to<a)to+=n;return(a+(to-a)*jp)/n;};
  const dA=-span(prv.d-1,cur.d-1,31)*TAU;dateHand.rotation.z=dateStar.rotation.z=dA;
  const wA=-span(prv.w,cur.w,7)*TAU;dowHand.rotation.z=dowStar.rotation.z=wA;
  monHand.rotation.z=-span(prv.m,cur.m,12)*TAU;
  leapHand.rotation.z=-span(prv.y%4,cur.y%4,4)*TAU;
  const pi0=(prv.y%4)*12+prv.m,pi1=(cur.y%4)*12+cur.m;program.rotation.z=-span(pi0,pi1,48)*TAU;
  lever.rotation.z=feelerAngle(lerp(RAD[monthLen(pi0)],RAD[monthLen(pi1)],jp));
  const age=(((mt+TZ)/86400+2440587.5-2451550.09766)%SYN+SYN)%SYN;moon.rotation.z=-(age/SYN-.5)*PI;
  const ampT=power>0&&!setting?2.3+2.3*Math.min(1,power/30):0;amp+=(ampT-amp)*Math.min(1,dt*(setting?9:power>0?3:1.2));
  const theta=amp*Math.sin(PI*((base%2)+f));balance.rotation.z=theta;
  const dir=(base%2?1:-1);pallet.rotation.z=.11*(-dir+2*dir*step)*(amp>.2?1:amp/.2);
  hair.update(s=>[.04+s*.165,s*HS_END+theta*(1-s)]);
  // winding parts
  const ratA=windTotal/8*TAU;ratchet.rotation.z=-ratA;crownWheel.rotation.z=ratA*.4/.22;crown.rotation.x=windTotal*1.6+crownTurn*TAU;
  if(crownPart&&explode<.001)crown.position.x=crownPart.base.x+pull*.16;
  if(setting){const t2=((mt%86400)+86400)%86400,c2=cal(mt);$('setTime').textContent=`${pad(t2/3600)}:${pad(t2%3600/60)} · ${c2.m+1} 月 ${c2.d} 日 周${WK[c2.w]}`;const mi=Math.floor(mt/60);if(soundOn&&lastMin>=0&&mi!==lastMin)tick(1);lastMin=mi;}
  click.rotation.z=click.userData.base+.16*((ratA*40/TAU)%1);
  if(Math.abs(power-lastMS)>.05){lastMS=power;const fr=power/72,ri=lerp(.47,.11,fr),ro=lerp(.76,.48,fr);mainspring.update(s=>[ri+(ro-ri)*s,s*14*TAU]);}
  prHand.rotation.z=(150-120*power/72)*PI/180;
  // explode
  if(explode!==explodeTarget){const st=.36*dt;explode=explode<explodeTarget?Math.min(explodeTarget,explode+st):Math.max(explodeTarget,explode-st);syncExplode();}
  if(explode!==lastE){applyExplode();lastE=explode;}
  // layer focus fade
  for(let l=0;l<NL;l++){const tg=(focus===null||focus===l)?1:.06;layerOp[l]+=(tg-layerOp[l])*Math.min(1,dt*8);
    for(const m of layerMats[l]){const op=m.userData.baseOp*layerOp[l],tr=m.userData.baseTr||layerOp[l]<.995;
      if(m.transparent!==tr){m.transparent=tr;m.needsUpdate=true;}m.opacity=op;m.depthWrite=!m.userData.baseTr&&layerOp[l]>.5;}}
  if(camTween){camTween.t=Math.min(1,camTween.t+dt/camTween.dur);const k=ease(camTween.t);camera.position.lerpVectors(camTween.from,camTween.to,k);controls.target.lerpVectors(camTween.ft,camTween.tt,k);if(camTween.t>=1)camTween=null;}
  if(!reduceMotion&&!camTween&&explode<.01)watch.rotation.y=Math.sin(t*.25)*.04;
  demoTick(dt);updateLabels();
  statT-=dt;if(statT<=0){updateStats();statT=.1;}
  controls.update();renderer.render(scene,camera);
  const ld=$('loader');if(ld&&!ld.classList.contains('done')){ld.classList.add('done');setTimeout(()=>ld.remove(),700);}
  requestAnimationFrame(loop);
}
loop();
},0));
